# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# cspell:ignore dependabot
---
name: rust
on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yaml"
  push:
    tags:
      - "*/*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
permissions: {}
jobs:
  binaries:
    name: binaries
    if: github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    timeout-minutes: 33
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install toolchain
        run: rustup toolchain install
      - name: select packages
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          meta="$(cargo metadata --no-deps --format-version 1)"
          if [[ "${REF_TYPE}" == 'tag' ]]; then
            pkg="${REF_NAME%%/*}"
            ver="${REF_NAME#*/}"
            found="$(jq -r --arg p "${pkg}" \
              '.packages[] | select(.name == $p) | .version' <<<"${meta}")"
            if [[ -z "${found}" || "${found}" != "${ver}" ]]; then
              echo "::error::tag [${REF_NAME}] mismatches version [${found}]"
              exit 1
            fi
            packages="${pkg}:${ver}"
          else
            packages="$(jq -r '[.packages[] | "\(.name):\(.version)"] | join(" ")' \
              <<<"${meta}")"
          fi
          echo "PACKAGES=${packages}" >>"${GITHUB_ENV}"
      - name: check format
        run: cargo fmt --all --check
      - name: test
        run: |
          read -ra list <<<"${PACKAGES}"
          names=("${list[@]%%:*}")
          cargo test --locked "${names[@]/#/--package=}"
      - name: build
        run: |
          read -ra list <<<"${PACKAGES}"
          names=("${list[@]%%:*}")
          cargo build --release --locked --target aarch64-unknown-linux-musl \
            "${names[@]/#/--package=}"
      - name: package
        run: |
          assets="${RUNNER_TEMP}/assets"
          mkdir -p "${assets}"
          read -ra list <<<"${PACKAGES}"
          for p in "${list[@]}"; do
            xz -T0 -c "target/aarch64-unknown-linux-musl/release/${p%%:*}" \
              >"${assets}/${p%%:*}-${p#*:}-aarch64-unknown-linux-musl.xz"
          done
          (cd "${assets}" && sha256sum -- *.xz >sha256sums)
          echo "ASSETS=${assets}" >>"${GITHUB_ENV}"
      - name: upload into draft
        if: github.event_name == 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          name: "branch [${{ github.head_ref }}] binaries"
          body: "branch [${{ github.head_ref }}] build from recent commit"
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          tag: v999
          artifacts: "${{ env.ASSETS }}/*"
      - name: release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          tag: ${{ github.ref_name }}
          artifacts: "${{ env.ASSETS }}/*"
