# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
---
name: test build
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  define-matrix:
    name: define matrix
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    outputs:
      matrix_list: ${{ steps.define-matrix.outputs.matrix_list }}
    steps:
      - name: checkout the repos
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false
      - name: define matrix
        id: define-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_WRITER }}
        run: |
          source ./matrix.sh
          echo "matrix_list=${JSON_LIST}" >> "${GITHUB_OUTPUT}"
  device-images:
    name: "[${{ matrix.element }}] image"
    timeout-minutes: 55
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix:
        element: ${{ fromJSON(needs.define-matrix.outputs.matrix_list) }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout the repos
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: false
      - name: build [${{ matrix.element }}] image
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_WRITER }}
          WRT_OPKG_REPO: ${{ secrets.WRT_OPKG_REPO }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: NAME2BUILD='${{ matrix.element }}' ./build.sh
      - name: release [${{ matrix.element }}] image
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'schedule' || github.event_name == 'push')
          && github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: >
            branch [${{
              github.head_ref == '' && github.ref_name || github.head_ref
            }}] images
          draft: true
          allowUpdates: true
          tag: rel999
          artifacts: "upload/*"
          repo: "green-wise"
          token: "${{ secrets.REGISTRY_WRITER }}"
          body: >
            branch [${{
              github.head_ref == '' && github.ref_name || github.head_ref
            }}] images from recent commit by GitHub actions
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: MegaLinter
        uses: oxsecurity/megalinter@v9
        env:
          VALIDATE_ALL_CODEBASE: true
  all-green:
    name: all green
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    needs:
      - MegaLinter
      - device-images
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
    steps:
      - name: waiting for checks success
        uses: poseidon/wait-for-status-checks@v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: all green, foobar
          timeout: 111s
